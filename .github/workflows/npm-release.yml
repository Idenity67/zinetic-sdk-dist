name: Publish npm SDK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @zinetic-idp/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify package
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          npm ci
          npm test
          npm pack --dry-run
          npm audit --audit-level=moderate --omit=dev

      - name: Publish package
        run: npm publish --access public --provenance

      - name: Verify published package
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            if npm view "@zinetic-idp/sdk@${TAG_VERSION}" version | grep -qx "$TAG_VERSION"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::@zinetic-idp/sdk@${TAG_VERSION} is not visible in the npm registry after publish"
              exit 1
            fi
            sleep 10
          done

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          npm init -y >/dev/null
          npm install "@zinetic-idp/sdk@${TAG_VERSION}"
          node --input-type=module -e "import { NHIProvider, fetchWithZinetic } from '@zinetic-idp/sdk'; if (typeof NHIProvider !== 'function' || typeof fetchWithZinetic !== 'function') process.exit(1);"
